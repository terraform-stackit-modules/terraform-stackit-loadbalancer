name: Terratest

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  TERRAFORM_VERSION: "1.3.0"
  GO_VERSION: "1.27.1"

jobs:
  terratest:
    name: Terratest
    runs-on: ubuntu-latest
    # Skip on forks as they won't have access to STACKIT secrets
    if: github.repository_owner == 'terraform-stackit-modules'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # This module's examples reference other terraform-stackit-modules published on the
      # OpenTofu Registry (the Terraform Registry is temporarily unavailable for this org),
      # so the Terratest options pin TerraformBinary = "tofu". Install OpenTofu here.
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Terratest
        working-directory: test
        env:
          STACKIT_SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
          STACKIT_PROJECT_ID: ${{ secrets.STACKIT_PROJECT_ID }}
        run: |
          go mod init github.com/terraform-stackit-modules/${{ github.event.repository.name }}
          go get github.com/gruntwork-io/terratest@v1.0.1
          go mod tidy
          go test -v -timeout 45m ./...
